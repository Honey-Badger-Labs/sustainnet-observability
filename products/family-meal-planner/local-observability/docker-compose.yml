# Local observability stack for Family Meal Planner.
# Passwords come from the repo-root .env (copy .env.example).
# From this directory: docker compose --env-file ../../../.env up -d
# Or run products/family-meal-planner/setup-local-demo.sh

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fmp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fmp-observability

  grafana:
    image: grafana/grafana:latest
    container_name: fmp-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - fmp-observability

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: fmp-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - fmp-observability

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fmp-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-sustainnet}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sustainnet_local}?sslmode=disable
    networks:
      - fmp-observability

networks:
  fmp-observability:
    external: true
    name: sustainnet-network  # Connect to existing local dev network

volumes:
  prometheus_data:
  grafana_data:
