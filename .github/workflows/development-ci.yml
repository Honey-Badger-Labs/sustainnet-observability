name: Development CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: '18'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Lint
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --if-present

      - name: Run linter
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build --if-present

  # ─────────────────────────────────────────────────────────────────────────────
  # CodeQL Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5

  # ─────────────────────────────────────────────────────────────────────────────
  # SonarQube Scan
  # ─────────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --if-present

      - name: Run tests with coverage
        run: npm run test:coverage --if-present || npm test --if-present

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=honey-badger-labs
            -Dsonar.projectKey=Honey-Badger-Labs_sustainnet-observability
            -Dsonar.sources=.
            -Dsonar.exclusions=docs/**,**/node_modules/**,**/*.md
            -Dsonar.qualitygate.wait=true

  # ─────────────────────────────────────────────────────────────────────────────
  # PR Status Check
  # ─────────────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [build, codeql, sonarcloud]
    if: github.event_name == 'pull_request'

    steps:
      - name: All checks passed
        run: echo "✅ All development CI checks passed!"

      - name: Add success comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const message = '✅ All CI checks passed! Ready for review and merge to staging.';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: message
            });